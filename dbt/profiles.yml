ecobottle:
  target: bigquery
  outputs:
    bigquery:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: ecobottle_analytics
      location: "{{ env_var('BQ_LOCATION', 'US') }}"
      threads: 2
      job_execution_timeout_seconds: 300
      maximum_bytes_billed: "{{ env_var('BQ_MAX_BYTES_BILLED', '1000000000') | int }}"
      job_retries: 1
